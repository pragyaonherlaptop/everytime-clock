<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everytime Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <svg id="clock" viewBox="-80 20 760 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vintage pocket watch showing the current time">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d8cc8e"/>
          <stop offset="0.35" stop-color="#a99a55"/>
          <stop offset="0.7" stop-color="#7d6f35"/>
          <stop offset="1" stop-color="#c2b46f"/>
        </linearGradient>
        <linearGradient id="goldFlat" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6f6330"/>
          <stop offset="0.3" stop-color="#d6c98a"/>
          <stop offset="0.6" stop-color="#8f8040"/>
          <stop offset="1" stop-color="#5e5328"/>
        </linearGradient>
        <radialGradient id="dialFill" cx="0.45" cy="0.4" r="0.7">
          <stop offset="0" stop-color="#f7f6f1"/>
          <stop offset="0.7" stop-color="#e9e8e1"/>
          <stop offset="1" stop-color="#d3d1c7"/>
        </radialGradient>
        <radialGradient id="subFill" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#f4f3ee"/>
          <stop offset="1" stop-color="#e2e0d8"/>
        </radialGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
          <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity="0.08"/>
        </linearGradient>
        <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
        </filter>
        <filter id="caseShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
        </filter>
      </defs>

      <!-- Everything inside #watch spins on the hour -->
      <g id="watch" filter="url(#caseShadow)">
        <g id="case"></g>
        <g id="dial"></g>
        <g id="subdial"></g>
        <g id="hands" filter="url(#handShadow)"></g>
        <g id="glassLayer"></g>
      </g>
    </svg>
    <button id="spinBtn" type="button">Test spin</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
